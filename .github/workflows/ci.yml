name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  done-check:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/chief-skills/upstream is a submodule; tests depend on it.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: pytest
        run: uv run pytest

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy .

  smoke-test:
    name: Container smoke test — non-root + migrate-on-start
    # Gate: done-check must be green first.  Runs on every push/PR (not just main)
    # so invariant regressions are caught before they can land.
    needs: done-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The core Dockerfile guards on the skills submodule; must be present.
          submodules: true

      - name: Build core image
        run: |
          docker build -f Dockerfile.core -t chief-smoke .

      # ── Invariant 1: non-root ───────────────────────────────────────────────
      # The Dockerfile sets USER chief (uid 1000). Override the entrypoint to
      # run `id -u` inside the container as the configured user; uid must be
      # non-zero (root is 0).
      - name: Assert container runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id chief-smoke -u)
          echo "Container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "FAIL: container is running as root (uid 0)" >&2
            exit 1
          fi
          echo "PASS: container is non-root (uid=$uid)"

      # ── Invariant 2: migrate-on-start ordering ──────────────────────────────
      # Run the container with a tmpfs at /data so the migration can write the
      # SQLite file (uid=1000 matches the container user).  The app will crash
      # after migration on missing secrets — that's expected and harmless; we
      # only care that the migration log line appears BEFORE the container exits.
      #
      # chief.entrypoint logs (JSON to stdout):
      #   "migration complete — starting app"
      # This line is emitted immediately before os.execv hands off to chief.app,
      # proving that alembic ran first.
      - name: Assert migration runs before app
        run: |
          logs=$(docker run --rm \
            --tmpfs /data:uid=1000,gid=1000 \
            -e DB_PATH=/data/chief.db \
            chief-smoke 2>&1 || true)
          echo "--- container logs ---"
          echo "$logs"
          echo "--- end logs ---"
          if echo "$logs" | grep -qF 'migration complete'; then
            echo "PASS: migration log found — alembic ran before app handoff"
          else
            echo "FAIL: 'migration complete' not found in container logs" >&2
            exit 1
          fi

  publish:
    name: Build + push images to GHCR
    # Only push on commits to main, not on pull-request runs.  The done-check
    # gate must be green first — if any test/lint/type step fails this job never
    # starts, so no broken image ever lands in the registry.
    needs: done-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The core and sandbox Dockerfiles assert that vendored-skills dirs
          # exist; the submodule must be checked out for those guards to pass.
          submodules: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image repository (lowercase)
        # GITHUB_REPOSITORY is already lowercase for most repos, but the spec
        # requires all GHCR image names to be lowercase.
        run: |
          echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build + push core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.core
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/core:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/core:latest

      - name: Build + push mcp-calendar
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mcp-calendar
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/mcp-calendar:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/mcp-calendar:latest

      - name: Build + push mcp-drive
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mcp-drive
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/mcp-drive:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/mcp-drive:latest

      - name: Build + push mcp-sheets
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mcp-sheets
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/mcp-sheets:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/mcp-sheets:latest

      - name: Build + push mcp-gmail
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mcp-gmail
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/mcp-gmail:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/mcp-gmail:latest

      - name: Build + push sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/sandbox:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/sandbox:latest

  # ---------------------------------------------------------------------------
  # Deploy (DEFERRED — no live VPS yet)
  #
  # This job is authored and wired but intentionally dormant until a VPS is
  # provisioned.  It will never run unless ALL three secrets below are set in
  # the repo (Settings → Secrets and variables → Actions → New repository
  # secret):
  #
  #   VPS_HOST   — hostname or IP of the target VPS (e.g. "1.2.3.4")
  #   VPS_USER   — SSH user on that host (e.g. "chief" or "ubuntu")
  #   VPS_SSH_KEY — the full private key (PEM / OpenSSH format) whose public
  #                 half is in ~/.ssh/authorized_keys on the VPS
  #
  # Activation steps (when a VPS is ready):
  #   1. Set the three secrets above in the GitHub repo settings.
  #   2. Ensure the VPS user can run `docker compose` without sudo (add to the
  #      `docker` group, or grant passwordless sudo for that command).
  #   3. Clone/copy docker-compose.yml + secrets/ onto the VPS under a deploy
  #      directory (e.g. ~/chief).
  #   4. Set the repo variable DEPLOY_DIR to the absolute path of that dir on
  #      the VPS (default: ~/chief).  Variable: Settings → Variables → Actions.
  #   5. Push a commit to main.  This job will run automatically on the next
  #      green build.
  #
  # The deploy command pulls the freshly-published :latest images and restarts
  # the stack in place, which triggers the migrate-on-start path inside core.
  # ---------------------------------------------------------------------------
  deploy:
    name: SSH deploy to VPS
    # Gate: must have a green done-check AND successfully published images.
    needs: [done-check, publish]
    # Only deploy on pushes to main (not PRs), AND only when the VPS secrets
    # are present.  `secrets.*` is '' (empty string) when unset, so this guard
    # keeps the job from running — and from failing — while no VPS exists.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.VPS_HOST != '' &&
      secrets.VPS_USER != '' &&
      secrets.VPS_SSH_KEY != ''
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # DEPLOY_DIR can be set as a repo variable; falls back to ~/chief.
          script: |
            cd "${{ vars.DEPLOY_DIR || '~/chief' }}"
            docker compose pull
            docker compose up -d
