name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  done-check:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: pytest
        run: uv run pytest

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy .

      # Cheap static gate on the installer scripts (#154); the full run is the
      # opt-in installer-e2e workflow.
      - name: shellcheck installer scripts
        run: shellcheck bootstrap.sh install.sh
