name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  done-check:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/chief-skills/upstream is a submodule; tests depend on it.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: pytest
        run: uv run pytest

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy .
