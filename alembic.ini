# Thin dev-CLI wrapper. Points the `alembic` command at the SOLE migration
# tree inside the package (src/chief/alembic/), which is also what
# _run_migrations uses at runtime. Run from the repo root:
#
#   uv run alembic -c alembic.ini upgrade head
#   uv run alembic -c alembic.ini revision --autogenerate -m "describe change"
#
# New revision files are created inside src/chief/alembic/versions/ — the
# only place they need to exist.

[alembic]
script_location = src/chief/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
