# Non-secret core configuration TEMPLATE (committed). The first-run wizard copies
# this to config.yaml, which is install-local state (gitignored) — the wizard and
# the agent (via edit_file + restart) write config.yaml in place. It stays out of
# the tracked tree, so restarts never commit it. Edit the live install's
# config.yaml, not this file. Secrets live in secrets/ or env — never here. Core
# ships a deliberately small set of keys; packages bring their own.
#
# Env overrides: CHIEF_DB_PATH, CHIEF_SOCKET_PATH, CHIEF_MAX_CONCURRENT_SESSIONS,
# OPENROUTER_API_KEY (or secrets/openrouter_api_key), CHIEF_PROVIDER_BASE_URL.

# Model roles. Core ships exactly one — the agent invents further roles via
# self-config. Two optional roles are honored when present, never required:
# `downgrade` (used when the budget is exhausted) and `cheap-judgment`
# (monitor model-predicates).
models:
  default: qwen/qwen3-coder

# OpenAI-compatible endpoint the DEFAULT/legacy backend streams from. Default =
# OpenRouter; leave it unless pointing chief's fallback backend at another
# OpenAI-compat host. Env: CHIEF_PROVIDER_BASE_URL.
provider_base_url: https://openrouter.ai/api/v1

# Per-model routing (optional; empty = one backend, the default above). Name
# extra backends under `provider_backends` (each an OpenAI-compat base_url plus
# a key resolved from `api_key_env` then a `secrets/<api_key_secret>` file —
# never an inline key), then map typed names to (backend, real model) under
# `provider_aliases`. A thread routes to an alias with `/model <alias>` or the
# agent's switch_model tool; any unlisted model uses the default backend. To
# drive a Claude SUBSCRIPTION via OAuth (a local proxy) for chosen models,
# install the `anthropic-oauth` package — it fills these in and documents the
# ToS / dead-budget-cap caveats. Example:
#   provider_backends:
#     proxy: {base_url: http://127.0.0.1:8000/v1, api_key_secret: proxy_api_key}
#   provider_aliases:
#     opus: {backend: proxy, model: claude-opus-4-8}

db_path: data/chief.db
socket_path: data/chief.sock
max_concurrent_sessions: 4

# Tool gate lists (code-enforced). Tools on neither list raise an approval
# card on the session's surface; unanswered cards deny after 10 minutes. A "*"
# in `approved` auto-approves EVERY tool (the "full permissions" switch);
# `never` always wins over it. Keep gates on until behavioral guardrails land.
gate:
  never: []
  approved: []

# OpenRouter dollars per calendar month. cap_usd 0 = unlimited (bootstrap
# sets a real cap); crossing warn_ratio notifies the owner.
budget:
  cap_usd: 0
  warn_ratio: 0.8

# "HH:MM-HH:MM" (may span midnight) — schedule fires inside the window are
# deferred to its end. Empty = no quiet hours.
quiet_hours: ""

# Packages: bundled defaults live in packages_dir; more come from the public
# chief-packages repo (cloned into data/packages by the chief-pkg CLI on first
# run). Discover with `chief-pkg list`/`search`; install/uninstall are
# document-driven (see the package-manager skill).
packages_dir: packages
packages_repo: https://github.com/CrazyWillBear/chief-packages

# iMessage adapter (macOS only; configured by the build-imessage package).
# owner_handles: the self-chat handle(s) — owner texts run turns, everyone
# else is logged + published for monitors.
imessage:
  enabled: false
  owner_handles: []
  poll_seconds: 2
