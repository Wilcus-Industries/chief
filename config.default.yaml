# Non-secret core configuration TEMPLATE (committed). The first-run wizard copies
# this to config.yaml, which is install-local state (gitignored) — the wizard and
# the agent (via edit_file + restart) write config.yaml in place. It stays out of
# the tracked tree, so restarts never commit it. Edit the live install's
# config.yaml, not this file. Secrets live in secrets/ or env — never here. Core
# ships a deliberately small set of keys; packages bring their own.
#
# Env overrides: CHIEF_DB_PATH, CHIEF_SOCKET_PATH, CHIEF_MAX_CONCURRENT_SESSIONS,
# OPENROUTER_API_KEY (or secrets/openrouter_api_key), CHIEF_PROVIDER_BASE_URL.

# Model roles. Core ships exactly one — the agent invents further roles via
# self-config. Two optional roles are honored when present, never required:
# `downgrade` (used when the budget is exhausted) and `cheap-judgment`
# (monitor model-predicates).
models:
  default: qwen/qwen3-coder
  # Sampling temperature for every LLM call (agent, monitors, compaction).
  # 0.0 = deterministic, best for agent reliability. Override if a swapped-in
  # model degrades at exactly 0. Applies to all roles, not just default.
  temperature: 0.0

# OpenAI-compatible endpoint the DEFAULT/legacy backend streams from. Default =
# OpenRouter; leave it unless pointing chief's fallback backend at another
# OpenAI-compat host. Env: CHIEF_PROVIDER_BASE_URL.
provider_base_url: https://openrouter.ai/api/v1

# Per-model routing (optional; empty = one backend, the default above). Name
# extra backends under `provider_backends` (each an OpenAI-compat base_url plus
# a key resolved from `api_key_env` then a `secrets/<api_key_secret>` file —
# never an inline key), then map typed names to (backend, real model) under
# `provider_aliases`. A thread routes to an alias with `/model <alias>` or the
# agent's switch_model tool; any unlisted model uses the default backend. To
# drive a Claude SUBSCRIPTION via OAuth (a local proxy) for chosen models,
# install the `anthropic-oauth` package — it fills these in and documents the
# ToS / dead-budget-cap caveats. Example:
#   provider_backends:
#     proxy: {base_url: http://127.0.0.1:8000/v1, api_key_secret: proxy_api_key}
#   provider_aliases:
#     opus: {backend: proxy, model: claude-opus-4-8}

db_path: data/chief.db
socket_path: data/chief.sock
max_concurrent_sessions: 4

# Tool gate lists (code-enforced). Tools on neither list raise an approval
# card on the session's surface; unanswered cards deny after 10 minutes. A "*"
# in `approved` auto-approves EVERY tool (the "full permissions" switch);
# `never` always wins over it. Keep gates on until behavioral guardrails land.
# `announce` posts a one-line "⚙ <tool> <args>" notice on the session's surface
# for every call that does NOT raise a card — so an approved or "always
# allow"ed tool is still visible instead of running silently. Set false for
# quiet channels.
gate:
  never: []
  approved: []
  announce: true

# OpenRouter dollars per calendar month. cap_usd 0 = unlimited (bootstrap
# sets a real cap); crossing warn_ratio notifies the owner.
budget:
  cap_usd: 0
  warn_ratio: 0.8

# "HH:MM-HH:MM" (may span midnight) — schedule fires inside the window are
# deferred to its end. Empty = no quiet hours.
quiet_hours: ""

# Packages: bundled defaults live in packages_dir; more come from the public
# chief-packages repo (cloned into data/packages by the chief-pkg CLI on first
# run). Discover with `chief-pkg list`/`search`; install/uninstall are
# document-driven (see the package-manager skill).
packages_dir: packages
packages_repo: https://github.com/Wilcus-Industries/chief-packages

# The host `shell` tool. It runs commands on the owner's machine (the gate still
# asks before each one until "always allow"ed). timeout_seconds is the DEFAULT bound
# on one command before it is killed — the agent can override it per call with the
# tool's `timeout` arg for genuinely slow work; output_limit caps captured
# stdout/stderr (bytes) before truncation. Persistent per-thread state (cwd, env) is
# lost only on a restart.
shell:
  timeout_seconds: 20
  output_limit: 30000

# Agent-loop hooks: packages that contribute per-turn context (pre_turn),
# once-per-thread context (session_start), or observe finished turns
# (post_turn). timeout_seconds bounds each hook — a slower or raising hook is
# logged and skipped, never stalling the turn. disabled lists package names
# whose hooks are turned off without uninstalling the package.
hooks:
  timeout_seconds: 10
  disabled: []

# iMessage adapter (macOS only; configured by the build-imessage package).
# owner_handles: the owner's handle(s) — owner texts run turns, everyone
# else is logged + published for monitors.
# mode: which Apple ID chief speaks as. self = the owner's own (today's
# install; chief is texted through the self-chat and compensates for it with
# the 🤖 prefix, twin dedup, self-chat scope and out-of-band send guard).
# dedicated = chief's own Apple ID in its own user session; all four are off.
imessage:
  enabled: false
  owner_handles: []
  poll_seconds: 2
  mode: self

# Per-channel live stream policy. Every turn always emits its coarse activity
# tick (and, for non-web threads, the rich inbound/final); this only governs
# the EXTRA live detail a tapped-in observer sees — token deltas, per-call tool
# ticks, and how a tool result loads (lazy = on click via /history, inline =
# streamed live, off = not at all + the tool tick drops its call_id). It is the
# LIVE stream only — /history always renders the full transcript regardless.
# A session row's own override (the agent's `session` create tool) beats this.
# Channels not listed default coarse (tick-only): the imessage/web observer
# surfaces ship rich. send_guard is carried for a later reply-from-web slice.
stream:
  channel_defaults:
    imessage: {deltas: true, tools: true, results: lazy, send_guard: true}
    web: {deltas: true, tools: true, results: lazy, send_guard: true}

# Context compaction: when a thread's transcript nears the model's context
# window, the old messages are folded into one summary note and the tail kept.
# Threshold = ratio * window. The window tracks the thread's CURRENT model,
# resolved per turn: a `windows` override wins; else it is fetched once from
# OpenRouter's /models metadata (only for OpenRouter-backed models); else
# `default_window`. Set a `windows` entry for any model on a non-OpenRouter
# backend (a local proxy), whose window can't be fetched. `/compact` forces a
# compaction now regardless of the threshold.
compaction:
  ratio: 0.95
  keep_recent: 20
  default_window: 60000
  windows: {}
  #   opus: 200000

# Keeping yourself current. Chief applies a new core release *onto* its own
# self-edits as an ordinary turn (the `self-update` skill), then restarts under
# the usual done-check seatbelt — so an update is never a checkout and never
# discards what chief has changed about itself.
#   autonomy: what a SCHEDULED update may do with nobody present.
#     off        — manual only; a schedule fires and does nothing but say so.
#     clean-only — apply clean updates; ask the owner on a collision (default).
#     full       — resolve collisions unattended and report afterwards.
#     Asking chief directly always works, whatever this is set to.
#   schedule: cron spec (UTC) for chief's own update check; "" = none. This key
#     is the source of truth — chief re-creates the schedule from it — so turn
#     scheduled updates off by clearing it, not only by deleting the schedule.
update:
  autonomy: clean-only
  schedule: ""
