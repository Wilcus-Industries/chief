# Non-secret configuration (committed). Secrets live in the secrets dir / env — never here.
# Every value here is overridable by an environment variable of the same name (uppercased).

# Owner ids — the one privileged user per platform. Configure at least one platform
# (id + token); 0 means "unset / platform off". Telegram id: ask @userinfobot. Discord id:
# Developer Mode → right-click yourself → Copy User ID. Tokens live in the secrets dir.
owner_telegram_id: 0
owner_discord_id: 0
owner_name: William Chastain

# Model posture (M11). The owner runs owner_model_default (Sonnet); Opus is approval-gated.
# /opus escalates a thread to owner_model_opus now (persists until /sonnet); Opus burns the
# Max budget faster, so it never runs unsanctioned. opus_auto_detect (opt-in) also lets a
# per-turn complexity classifier ASK before escalating a complex owner task. Guests are
# pinned to guest_model (never Opus).
owner_model_default: claude-sonnet-4-6
owner_model_opus: claude-opus-4-8
opus_auto_detect: false
guest_model: claude-sonnet-4-6

# Agent backend (#88): the GitHub Copilot SDK is chief's sole harness. The
# claude-agent-sdk backend and the ``agent_backend`` selector are gone — do not re-add
# an ``agent_backend:`` line here (``agent_backend: claude`` now fails the boot with a
# migration message; ``copilot`` is tolerated but inert). The Copilot CLI manages its
# own auth in ~/.copilot/config.json.

# Model routing (#79, part of #72), opt-in. When routing_enabled, an owner task's
# spawning message is auto-classified into one job category (on classifier_model, never a
# routing target) and the category's target picks the session's model + provider. Target
# classes: "copilot" (Copilot quota — model "auto", no per-model choice, spike #74) and
# "openrouter" (BYOK per-model; needs openrouter_api_key in the secrets dir). /route
# <category> overrides a thread; routing_surface_defaults (keys: home/dm/group) pin a
# category per surface without classifying. The category set IS the seeded routes.
# When routing is on, chief also gets a gated self-config tool (#83): on request it can
# amend its own routing table — a category's {target_class, model}, and the category set
# itself (add/remove/rename/re-describe) — through the permission gate (each edit asks).
# Edits persist and drive the next classify/route; guest/budget guardrails stay out of
# reach (the tool is owner-only and only ever sets copilot/openrouter).
routing_enabled: false
# routing_seed defaults to: writing/research/general → copilot auto; code/reasoning →
# openrouter deepseek/deepseek-v4-flash. Override to re-target (the bridge slice later
# points code/reasoning at Max):
# routing_seed:
#   - {category: writing,   target_class: copilot,    model: auto}
#   - {category: research,  target_class: copilot,    model: auto}
#   - {category: general,   target_class: copilot,    model: auto}
#   - {category: code,      target_class: openrouter, model: deepseek/deepseek-v4-flash}
#   - {category: reasoning, target_class: openrouter, model: deepseek/deepseek-v4-flash}
# routing_surface_defaults: {}   # e.g. {group: general}

# sqlite file path (repo-local data/ dir, gitignored; ~ expands).
db_path: data/chief.db

# What a guest hears back: the canned ack when guest mode is off, and the holding ack
# while a new contact awaits admission when it's on.
guest_ack: Thanks for reaching out — I'm an assistant and I've passed your message along.

# Guest receptionist (M6, opt-in). With guest_enabled on, guests route into a tight,
# tier-isolated session (leave-a-message + — when calendar_enabled — free/busy +
# owner-approved booking) instead of the canned ack. Requires front_desk_thread_key
# (where admissions, relays, and guest approvals land). The rate limits guard the owner's
# Max limits: a per-guest cap and a global guest budget over a shared window.
guest_enabled: false
# guest_rate_per_window: 10
# guest_rate_window_seconds: 3600
# guest_global_rate_per_window: 60

# Task engine (M2).
concurrency: 3              # max tasks actively generating a turn at once
turn_timeout_seconds: 300  # watchdog: a turn past this (wedged stream) is torn down, not frozen
idle_archive_seconds: 3600 # mark done + archive a task after this much inactivity (~1h)
classifier_model: anthropic/claude-haiku-4.5  # cheap stop-intent / warrants-a-task judgments; OpenRouter-namespaced id (vendor/model)

# Permission gate + approval flow (M3, flipped host-native). Owner tool calls are
# ALLOWED by default; only a blacklist match posts an approval card (which blocks until
# a button tap or this timeout, then fail-closed deny). Guests stay default-ask.
approval_timeout_seconds: 600  # no decision within this window = deny
audit_log_path: data/audit.jsonl  # append-only JSONL: tool calls + approval decisions
# front_desk_thread_key:           # required by guest_enabled — admissions/relays/approvals land here
# Boot-seeded policy rules (idempotent). Each item: {tool, arg_pattern?}; arg_pattern
# omitted = whole-tool rule. NEVER still hard-denies with no prompt; APPROVED entries
# (and "always allow" taps) beat the blacklist.
never_seed: []      # tools/commands hard-denied with no prompt
approved_seed: []   # tools/commands pre-allowed with no prompt
# Approval blacklist — what still asks under the default-allow posture. Shell patterns
# are regexes matched against the bash tool's command; tools are whole tool names that
# always ask. Being off a session's allowed_tools list is NOT enough by itself to card
# a call anymore (owner default-allow) — one of these two lists is what does it. Omit
# blacklist_shell_patterns to get the built-in default set (sudo/doas, rm -rf on a root,
# mkfs / dd to devices, shutdown/reboot, kill -9 1, curl|sh, git push --force main,
# chmod -R 777, global package installs). Omit blacklist_tools to get its default set —
# every Google write tool (Gmail send/reply/draft/label/trash, calendar create/update,
# Drive upload, Sheets writes; see config.py's _DEFAULT_BLACKLIST_TOOLS for the exact
# list). Listing either key here REPLACES its whole default set, so include the
# defaults you want to keep alongside anything you add.
# blacklist_shell_patterns: []
# blacklist_tools: []              # e.g. [mcp__gmail_chief__gmail_send_message]

# Untrusted-content screening (host-native security seam). Web/browser tool results,
# Gmail/Drive reads, and guest messages are screened for prompt injection by a cheap
# model call; a hit is annotated with a warning so the agent treats it as data
# (screening_block: true blocks the tool result outright instead — leaving it false
# keeps screening advisory/annotate-only). Fail-safe: a screener error passes content
# through un-annotated rather than blocking the turn. Content past the ~20k-char head
# window screened (screening.py's _MAX_SCREEN_CHARS) is not inspected, and content
# fetched via the host shell (curl/wget) bypasses this seam entirely — both are
# accepted residual gaps, not bugs.
screening_enabled: true
screening_model: anthropic/claude-haiku-4.5  # OpenRouter-namespaced id (vendor/model); a bare id fails every screen OPEN
screening_block: false
# screening_tools:                 # which tools' results get screened (defaults shown)
#   - mcp__chief_web__fetch
#   - mcp__chief_web__search
#   - mcp__playwright__browser_snapshot
#   - mcp__playwright__browser_navigate
#   - mcp__playwright__browser_navigate_back
#   - mcp__playwright__browser_click
#   - mcp__playwright__browser_type
#   - mcp__playwright__browser_hover
#   - mcp__playwright__browser_drag
#   - mcp__playwright__browser_drop
#   - mcp__playwright__browser_select_option
#   - mcp__playwright__browser_press_key
#   - mcp__playwright__browser_fill_form
#   - mcp__playwright__browser_file_upload
#   - mcp__playwright__browser_handle_dialog
#   - mcp__gmail_chief__gmail_list_messages
#   - mcp__gmail_chief__gmail_get_message
#   - mcp__gmail_chief__gmail_search_messages
#   - mcp__gmail_chief__gmail_list_drafts
#   - mcp__drive__ReadDriveFile

# Long-term memory (M4). Namespaced markdown facts; the facts/ listing is auto-generated
# at prompt-build time (no stored index file). Chief reads fact files on demand and writes
# memory directly in-session via its Write tool; every write is git-versioned.
memory_dir: data/memory      # host dir holding Soul/User + facts/ (gitignored)
memory_git: true             # version every memory write op with local git
git_author_name: chief
git_author_email: chief@localhost

# Google services (M5/M8). Flip each *_enabled on once its MCP container is up and the
# shared OAuth token is minted (secrets/README.md). Owner sessions then read freely;
# writes post an approval card. The containers publish their ports on 127.0.0.1 only,
# so the host-native core reaches them via localhost (never exposed beyond this
# machine). Enabling drive/sheets/gmail needs the token re-minted with their scopes
# (M8) — see secrets/README.md.
calendar_enabled: true    # mcp-calendar container up; token is calendar-scope only
calendar_mcp_url: http://127.0.0.1:8003/mcp
drive_enabled: false
drive_mcp_url: http://127.0.0.1:8001/mcp
sheets_enabled: true
sheets_mcp_url: http://127.0.0.1:8002/mcp
gmail_enabled: true
gmail_mcp_url: http://127.0.0.1:8004/mcp
# Transparent signature appended server-side to every message chief sends. Not a config
# key — set the GMAIL_SIGNATURE environment variable (see secrets/README.md); {owner}
# fills from OWNER_NAME. Default: "Sent by {owner}'s assistant on their behalf."
owner_tz: America/Los_Angeles          # IANA tz for booking times, e.g. America/New_York

# Browser automation (M13, owner-only, opt-in). With playwright_enabled on, owner
# sessions get the @playwright/mcp 0.0.76 tool set (headless Chromium, --no-sandbox).
# Read tools (navigate, snapshot, screenshot, console/network inspection) are
# pre-approved; write tools (click, type, fill, drag, JS) reach the approval card.
# Bring up the container first: docker compose --profile playwright up
playwright_enabled: false
playwright_mcp_url: http://127.0.0.1:3000/mcp

# Host shell + file workspace (M7, host-native, owner-only). shell_enabled gives the
# owner a bash tool that runs a persistent per-task shell directly on this machine
# ($SHELL, else bash, else zsh) with the full environment; commands run without approval
# unless they match the blacklist above. workspace_enabled adds Write/Edit (pre-approved);
# workspace_dir is the shell's starting cwd and the suggested scratch area.
shell_enabled: true
workspace_enabled: true
workspace_dir: data/workspace        # shell cwd + scratch area (repo-local, gitignored)
shell_timeout_seconds: 900           # per-command wall clock; a hang is SIGINT'd + respawned
shell_output_limit: 64000            # cap on captured stdout/stderr bytes (then truncated)

# chief-owned web tools (#81, part of #72, owner-only, opt-in). With web_tools_enabled on,
# owner sessions get a web-fetch + web-search tool that reach both backends (the Copilot
# SDK has no built-in web tools). web-fetch is SSRF-guarded (private/loopback/link-local
# targets refused, redirects re-validated) and asks for approval; web-search needs the
# brave_search_api_key secret (without it, search returns a "not configured" note).
web_tools_enabled: false
# web_fetch_timeout_seconds: 15       # per-fetch wall clock
# web_fetch_max_bytes: 5000000        # cap on bytes read from a single page
# web_search_count: 5                 # results returned per web-search

# Scheduler (M9a, opt-in). With scheduler_enabled on, a long-running tick fires the
# reminders, recurring jobs, and self-cron the owner sets up. It needs primary_thread_key
# (the owner inbox those land in — prefer a real topic over the casual General channel)
# and primary_platform (which chat stack owns the loop) — both required when enabled.
# owner_tz (above) frames cron + quiet hours. Bash schedules also need shell_enabled.
# Scheduling a shell command is approval-gated at creation time.
scheduler_enabled: false
# scheduler_tick_seconds: 30         # how often the tick scans for due schedules
primary_platform: telegram           # which configured stack the scheduler delivers through
# primary_thread_key: "-100:7"       # required by scheduler_enabled — reminders/alerts land here
# quiet_hours_start: "22:00"         # HH:MM (owner_tz); a non-urgent fire inside the window defers
# quiet_hours_end: "07:00"           # HH:MM (owner_tz); deferred fires release here
# heartbeat_url:                     # dead-man's-switch GET pinged on the interval; unset disables
# heartbeat_interval_seconds: 300    # seconds between heartbeat pings
# monitor_model: auto                # agent-monitor predicate model — Copilot-format id (NOT the OpenRouter classifier namespace); Student plan serves 'auto' regardless

# Usage budgeting (#84, opt-in). With budget_enabled on, each turn is metered in the native
# currency it spent (no cross-currency conversion): Copilot premium requests vs
# premium_request_cap, and OpenRouter dollars vs openrouter_dollar_cap. Crossing a
# budget_warn_fractions tier warns the owner once; reaching budget_exhaust_fraction runs
# that currency's action — premium requests pause the owner's turns and post a choice card,
# OpenRouter dollars downgrade the routed openrouter categories onto Copilot
# budget_downgrade_model (auto). Warnings + the card route to primary_thread_key, so set it
# (as the scheduler does). budget_cycle_anchor_day (1–28) is the cycle reset day in owner_tz.
budget_enabled: false
# premium_request_cap: 200           # Copilot premium-request cap (200/mo, Student plan)
# openrouter_dollar_cap: 20.0        # OpenRouter BYOK dollar cap
# budget_warn_fractions: [0.75, 0.9] # warn-once thresholds (each in (0,1], auto-sorted)
# budget_exhaust_fraction: 1.0       # fraction of a cap that triggers its action
# budget_downgrade_model: auto       # Copilot model an openrouter category downgrades onto
# budget_cycle_anchor_day: 1         # day-of-month the billing cycle resets (1–28)

# Skills framework (M10, opt-in). With skills_enabled on, owner sessions load a curated
# set of packaged workflows (SKILL.md dirs) the Agent SDK runs natively — vendored from
# github.com/anthropics/skills (the vendor/chief-skills/upstream submodule) and exposed
# through chief's own plugin manifest (vendor/chief-skills). Owner-only: guests never see
# skills (tier isolation). default_skills is the enable-list; trim or extend it here.
skills_enabled: false
# default_skills:                    # the curated owner default — chief workflow + docs/dev
#   - setup-morning-brief            #   chief-owned: the first packaged workflow (M10)
#   - docx                           #   Office docs: produce/parse files swapped over chat
#   - pdf
#   - pptx
#   - xlsx
#   - doc-coauthoring                #   writing/comms: draft proposals, specs, updates
#   - internal-comms
#   - claude-api                     #   dev/meta: the owner is a developer
#   - skill-creator                  #   also backs the "chief drafts a new skill" story
#   - mcp-builder
# Excluded from the default (still on disk via the submodule — re-enable by listing above):
#   algorithmic-art, canvas-design, slack-gif-creator, theme-factory, brand-guidelines
#   (creative/styling), frontend-design, web-artifacts-builder, webapp-testing (GUI-bound).

# Category-routed subagents (#87, part of #72, opt-in; Copilot backend). With
# subagents_enabled on, owner sessions carry chief's built-in subagents; each declares a
# job category (not a model id) whose model is resolved through the routing table above —
# with routing_enabled off, a subagent runs on the parent session's model. Owner-only:
# guests never get subagents. Milestones surface each subagent delegation and its model.
subagents_enabled: false
# subagents_dir: data/harness/subagents  # on-disk overrides (#105): one .md per
#   subagent (stem = name, frontmatter category/description/skills, body = prompt);
#   absent/empty keeps the built-ins above.
# self_config_path: data/harness/self_config.yaml  # chief-authored overlay (#107): deep-
#   merged over this file at boot; security keys (blacklists, seeds, screening, *_enabled,
#   owner ids, secrets, db_path, MCP urls, thread keys, memory/harness_git) are dropped
#   with a warning. Applies at the next restart; absent/broken file boots clean.

# Group chats (M11, opt-in). With group_chat_enabled on, chief works in group chats it's
# invited to (any non-home group/supergroup or guild) beyond the owner's home and 1:1 DMs.
# In a group it reads every message ambiently but stays silent until @mentioned or
# replied-to; an engaged owner gets the full owner toolset (output posts in the group, but
# every tool-approval card is DM'd privately to primary_thread_key), and an engaged
# non-owner gets the receptionist (no tools). Requires primary_thread_key (the owner DM
# for those approval cards) AND at least one home id below — owner_home_chat_id (Telegram)
# / owner_home_guild_id (Discord) — so chief can tell its own HOME surface from a GROUP.
group_chat_enabled: false
# owner_home_chat_id:                  # Telegram: the owner's home forum supergroup id (HOME, not a GROUP)
# owner_home_guild_id:                 # Discord: the owner's home server/guild id (HOME, not a GROUP)
# group_context_max_messages: 50       # cap on the per-group ambient buffer (last N since join)
