# Non-secret configuration (committed). Secrets live in Docker secrets / env — never here.
# Every value here is overridable by an environment variable of the same name (uppercased).

# Owner ids — the one privileged user per platform. Configure at least one platform
# (id + token); 0 means "unset / platform off". Telegram id: ask @userinfobot. Discord id:
# Developer Mode → right-click yourself → Copy User ID. Tokens live in Docker secrets.
owner_telegram_id: 0
owner_discord_id: 0
owner_name: William Chastain

# Model posture (M11). The owner runs owner_model_default (Sonnet); Opus is approval-gated.
# /opus escalates a thread to owner_model_opus now (persists until /sonnet); Opus burns the
# Max budget faster, so it never runs unsanctioned. opus_auto_detect (opt-in) also lets a
# per-turn complexity classifier ASK before escalating a complex owner task. Guests are
# pinned to guest_model (never Opus).
owner_model_default: claude-sonnet-4-6
owner_model_opus: claude-opus-4-8
opus_auto_detect: false
guest_model: claude-sonnet-4-6

# sqlite file path (inside the container this is on the persisted volume).
db_path: /data/chief.db

# What a guest hears back: the canned ack when guest mode is off, and the holding ack
# while a new contact awaits admission when it's on.
guest_ack: Thanks for reaching out — I'm an assistant and I've passed your message along.

# Guest receptionist (M6, opt-in). With guest_enabled on, guests route into a tight,
# tier-isolated session (leave-a-message + — when calendar_enabled — free/busy +
# owner-approved booking) instead of the canned ack. Requires front_desk_thread_key
# (where admissions, relays, and guest approvals land). The rate limits guard the owner's
# Max limits: a per-guest cap and a global guest budget over a shared window.
guest_enabled: false
# guest_rate_per_window: 10
# guest_rate_window_seconds: 3600
# guest_global_rate_per_window: 60

# Task engine (M2).
concurrency: 3              # max tasks actively generating a turn at once
grace_seconds: 6.0         # inline reply if the turn finishes within this, else "working…"
turn_timeout_seconds: 300  # watchdog: a turn past this (wedged stream) is torn down, not frozen
idle_archive_seconds: 3600 # mark done + archive a task after this much inactivity (~1h)
classifier_model: claude-haiku-4-5  # cheap stop-intent / warrants-a-task judgments

# Permission gate + approval flow (M3). The gate classifies every tool call; an ASK posts
# an approval card and blocks until a button tap or this timeout (then fail-closed deny).
approval_timeout_seconds: 600  # no decision within this window = deny
audit_log_path: /data/audit.jsonl  # append-only JSONL: tool calls + approval decisions
# front_desk_thread_key:           # required by guest_enabled — admissions/relays/approvals land here
# Boot-seeded policy rules (idempotent). Each item: {tool, arg_pattern?}; arg_pattern
# omitted = whole-tool rule. Real entries arrive with the tools they guard (M5/M7/M8).
never_seed: []      # tools/commands hard-denied with no prompt
approved_seed: []   # tools/commands pre-allowed with no prompt

# Long-term memory (M4). Markdown facts + a MEMORY.md index loaded into every prompt;
# chief reads fact files on demand (read-only, confined to memory_dir). A quiet task is
# distilled into durable facts after distill_idle_seconds (set ~30 locally to test).
memory_dir: /memory          # persisted volume holding Soul/User/MEMORY + facts/
distill_idle_seconds: 1200   # quiet window (~20m) before distilling a task's transcript
distill_model: claude-sonnet-4-6  # owner model extracts facts from the transcript
memory_git: true             # version every memory write op with local git
git_author_name: chief
git_author_email: chief@localhost

# Google services (M5/M8). Flip each *_enabled on once its MCP container is up and the
# shared OAuth token is minted (secrets/README.md). Owner sessions then read freely;
# writes post an approval card. URLs are internal compose addresses (no public ingress);
# the MCP endpoint is mounted at /mcp. Enabling drive/sheets/gmail needs the token
# re-minted with their scopes (M8) — see secrets/README.md.
calendar_enabled: true    # mcp-calendar container up; token is calendar-scope only
calendar_mcp_url: http://mcp-calendar:8003/mcp
drive_enabled: false
drive_mcp_url: http://mcp-drive:8001/mcp
sheets_enabled: true
sheets_mcp_url: http://mcp-sheets:8002/mcp
gmail_enabled: true
gmail_mcp_url: http://mcp-gmail:8004/mcp
# Transparent signature appended server-side to every message chief sends. Not a config
# key — set the GMAIL_SIGNATURE environment variable (see secrets/README.md); {owner}
# fills from OWNER_NAME. Default: "Sent by {owner}'s assistant on their behalf."
owner_tz: America/Los_Angeles          # IANA tz for booking times, e.g. America/New_York

# Shell sandbox + file workspace (M7, owner-only, opt-in). Bring up the secret-free
# sandbox container (docker compose --profile sandbox up) and flip these on. shell_enabled
# gives the owner a bash tool that forwards to the sandbox; every command is approval-gated
# unless pre-blessed. workspace_enabled adds Write/Edit, gate-confined to /workspace (a
# volume shared with the sandbox). The sandbox holds NO secrets and a restricted FS.
shell_enabled: false
workspace_enabled: false
workspace_dir: /workspace            # scratch volume, mounted rw in both core and sandbox
sandbox_host: sandbox                # internal compose service name (no host ports)
sandbox_port: 8765
shell_timeout_seconds: 120           # per-command wall clock; a hang is SIGINT'd + respawned
shell_output_limit: 64000            # cap on captured stdout/stderr bytes (then truncated)

# Scheduler (M9a, opt-in). With scheduler_enabled on, a long-running tick fires the
# reminders, recurring jobs, and self-cron the owner sets up. It needs primary_thread_key
# (the owner inbox those land in — prefer a real topic over the casual General channel)
# and primary_platform (which chat stack owns the loop) — both required when enabled.
# owner_tz (above) frames cron + quiet hours. Bash schedules also need shell_enabled and
# the sandbox up. Scheduling a shell command is approval-gated at creation time.
scheduler_enabled: false
# scheduler_tick_seconds: 30         # how often the tick scans for due schedules
primary_platform: telegram           # which configured stack the scheduler delivers through
# primary_thread_key: "-100:7"       # required by scheduler_enabled — reminders/alerts land here
# quiet_hours_start: "22:00"         # HH:MM (owner_tz); a non-urgent fire inside the window defers
# quiet_hours_end: "07:00"           # HH:MM (owner_tz); deferred fires release here
# heartbeat_url:                     # dead-man's-switch GET pinged on the interval; unset disables
# heartbeat_interval_seconds: 300    # seconds between heartbeat pings

# Usage budgeting (M9, opt-in). With budget_enabled on, each turn's SDK cost rolls into a
# month-to-date total against monthly_credit_usd (the fixed credit ceiling). Crossing a
# budget_warn_fractions tier warns the owner once; reaching budget_exhaust_fraction pauses
# the owner's turns and posts a choice card (downgrade / continue full-quality / approve
# pay-as-you-go overflow). Warnings + the card route to primary_thread_key, so set it (as
# the scheduler does). budget_cycle_anchor_day (1–28) is the cycle reset day in owner_tz.
budget_enabled: false
# monthly_credit_usd: 200.0          # fixed monthly credit ceiling spend draws from
# budget_warn_fractions: [0.75, 0.9] # warn-once thresholds (each in (0,1], auto-sorted)
# budget_exhaust_fraction: 1.0       # fraction that triggers the pause+ask card
# budget_downgrade_model: claude-haiku-4-5-20251001  # model the Downgrade choice switches to
# budget_cycle_anchor_day: 1         # day-of-month the billing cycle resets (1–28)

# Skills framework (M10, opt-in). With skills_enabled on, owner sessions load a curated
# set of packaged workflows (SKILL.md dirs) the Agent SDK runs natively — vendored from
# github.com/anthropics/skills (the vendor/chief-skills/upstream submodule) and exposed
# through chief's own plugin manifest (vendor/chief-skills). Owner-only: guests never see
# skills (tier isolation). default_skills is the enable-list; trim or extend it here.
skills_enabled: false
# default_skills:                    # the curated owner default — chief workflow + docs/dev
#   - setup-morning-brief            #   chief-owned: the first packaged workflow (M10)
#   - docx                           #   Office docs: produce/parse files swapped over chat
#   - pdf
#   - pptx
#   - xlsx
#   - doc-coauthoring                #   writing/comms: draft proposals, specs, updates
#   - internal-comms
#   - claude-api                     #   dev/meta: the owner is a developer
#   - skill-creator                  #   also backs the "chief drafts a new skill" story
#   - mcp-builder
# Excluded from the default (still on disk via the submodule — re-enable by listing above):
#   algorithmic-art, canvas-design, slack-gif-creator, theme-factory, brand-guidelines
#   (creative/styling), frontend-design, web-artifacts-builder, webapp-testing (GUI-bound).

# Group chats (M11, opt-in). With group_chat_enabled on, chief works in group chats it's
# invited to (any non-home group/supergroup or guild) beyond the owner's home and 1:1 DMs.
# In a group it reads every message ambiently but stays silent until @mentioned or
# replied-to; an engaged owner gets the full owner toolset (output posts in the group, but
# every tool-approval card is DM'd privately to primary_thread_key), and an engaged
# non-owner gets the receptionist (no tools). Requires primary_thread_key (the owner DM
# for those approval cards) AND at least one home id below — owner_home_chat_id (Telegram)
# / owner_home_guild_id (Discord) — so chief can tell its own HOME surface from a GROUP.
group_chat_enabled: false
# owner_home_chat_id:                  # Telegram: the owner's home forum supergroup id (HOME, not a GROUP)
# owner_home_guild_id:                 # Discord: the owner's home server/guild id (HOME, not a GROUP)
# group_context_max_messages: 50       # cap on the per-group ambient buffer (last N since join)
