# Non-secret core configuration (committed). Secrets live in secrets/ or env — never
# here. Core ships a deliberately small set of keys; packages bring their own.
#
# Env overrides: CHIEF_DB_PATH, CHIEF_SOCKET_PATH, CHIEF_MAX_CONCURRENT_SESSIONS,
# OPENROUTER_API_KEY (or secrets/openrouter_api_key).

# Model roles. Core ships exactly one — the agent invents further roles
# (compaction, cheap-judgment, …) via self-config.
models:
  default: anthropic/claude-sonnet-4.5

db_path: data/chief.db
socket_path: data/chief.sock
max_concurrent_sessions: 4
