# chief core stack (M0/M1) + chief's own Google MCP servers (M5/M8).
# Outbound-only — Telegram long-poll / Discord gateway, no public ingress.
# Secrets are Docker secrets (files under ./secrets/, mounted at /run/secrets, read by
# config.py).
#
# Setup:  put ./secrets/claude_code_oauth_token, then configure either or both chat
#         platforms (config rejects boot with neither):
#           Telegram — ./secrets/telegram_bot_token + OWNER_TELEGRAM_ID
#           Discord  — ./secrets/discord_bot_token  + OWNER_DISCORD_ID (enable the
#                      privileged message_content intent in the Developer Portal)
#         A referenced docker-secret file must exist, so for the platform you skip,
#         `touch` its empty token file (e.g. `touch secrets/discord_bot_token`). Then:
#           docker compose up core
#
# Google (M5/M8, opt-in):  chief's own FastMCP servers — calendar (:8003), drive (:8001),
#         sheets (:8002), gmail (:8004, chief-owned after the issue #52 cutover) — each a
#         separate container on the internal compose
#         network, reached by core over streamable-HTTP at http://mcp-<svc>:<port>/mcp
#         (never host-published). Mint the shared token (python -m chief.tools.google.auth)
#         — it writes directly to secrets/google_tokens/google_token.json, the single
#         canonical location all five consumers mount (issue #58). Flip the matching
#         *_enabled in config.yaml, then:
#           docker compose --profile google up
#         The four sit behind the "google" profile, so a plain `up` skips them.
services:
  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    restart: unless-stopped
    # Non-root, matching the MCP services pattern. uid/gid 1000 is "chief"
    # (created in Dockerfile.core). Volumes are pre-chowned to 1000:1000 in the image;
    # for pre-existing named volumes run the one-time chown step in secrets/README.md.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # core bridges both internal networks: it must reach the Google MCP services on
    # mcp-internal and the browser on playwright-net. The two never overlap, so a
    # compromised playwright container has no route to calendar/drive/sheets/gmail.
    networks:
      - mcp-internal
      - playwright-net
    environment:
      # Non-secret: overrides config.yaml. Must NOT set ANTHROPIC_API_KEY (config rejects it).
      # Both owner ids are optional here — config requires at least one platform fully set
      # (id + token). Leave one blank to run the other platform only.
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-}
      OWNER_DISCORD_ID: ${OWNER_DISCORD_ID:-}
      # Per-deploy instance config — set in the gitignored .env, never in committed
      # config.yaml (keeps personal ids out of a public repo). Each overrides its
      # config.yaml default only when non-empty.
      PRIMARY_PLATFORM: ${PRIMARY_PLATFORM:-}
      PRIMARY_THREAD_KEY: ${PRIMARY_THREAD_KEY:-}
      OWNER_HOME_GUILD_ID: ${OWNER_HOME_GUILD_ID:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-}
      GROUP_CHAT_ENABLED: ${GROUP_CHAT_ENABLED:-}
      BUDGET_ENABLED: ${BUDGET_ENABLED:-}
      DRIVE_ENABLED: ${DRIVE_ENABLED:-}
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-}
      SKILLS_ENABLED: ${SKILLS_ENABLED:-}
      OPUS_AUTO_DETECT: ${OPUS_AUTO_DETECT:-}
      # Relocate the claude CLI's top-level config dir from $HOME (read-only rootfs) into
      # the persisted claude-home volume. Without this, the CLI writes .claude.json (and
      # its lock) directly under $HOME=/home/chief, hitting EROFS on a read_only container.
      # With CLAUDE_CONFIG_DIR set the SDK places .claude.json at
      # $CLAUDE_CONFIG_DIR/.claude.json = /home/chief/.claude/.claude.json (inside the
      # volume). Transcripts remain at $CLAUDE_CONFIG_DIR/projects/... as before, so
      # session resume is unaffected.
      CLAUDE_CONFIG_DIR: /home/chief/.claude
    secrets:
      # Docker secrets are always mounted read-only at /run/secrets/<name> (tmpfs,
      # mode 0444 inside the container). No explicit :ro needed; it is guaranteed by Docker.
      - telegram_bot_token
      - discord_bot_token
      - claude_code_oauth_token
    volumes:
      # Mounted read-only over the image's baked copy (Dockerfile COPYs it as a fallback)
      # so a config.yaml edit takes effect on `up -d` with no rebuild. config.py reads
      # ./config.yaml relative to WORKDIR /app, so this is the exact path it loads.
      - ./config.yaml:/app/config.yaml:ro
      - sqlite-data:/data
      - memory:/memory
      # Scratch (M7) for chief's built-in Read/Write/Edit tools. Harmless when the
      # workspace is disabled.
      - workspace:/workspace
      # Persisted claude CLI state: transcripts (projects/), credentials (.credentials.json),
      # and top-level config (.claude.json + .claude.json.lock). CLAUDE_CONFIG_DIR (set
      # above) points the CLI here so all three land inside this volume rather than on the
      # read-only rootfs. Without persistence a recreate wipes every stored session, leaving
      # sqlite's sdk_session_ids pointing at sessions that no longer exist → CLI exits 1 on
      # resume. Pre-chowned to uid 1000 in Dockerfile.core so Docker init copies correct
      # ownership into a freshly-created volume.
      - claude-home:/home/chief/.claude
      # Screenshot delivery (issue #34): core reads screenshot files written by
      # mcp-playwright to deliver them to the owner via send_file. Read-only — core
      # never writes to this volume; playwright is the sole writer.
      - screenshots:/screenshots:ro
      # Google account registry (issue #54): core scans /token for google_token*.json
      # files to populate list_accounts / set_account. Sourced from the dedicated
      # google_tokens/ subdir (issue #58: single canonical host path shared by all five
      # token-consuming services).
      #
      # Read-WRITE (issue #53): the runtime add-account flow (chat consent) writes the
      # newly-minted token here as google_token_<email-slug>.json, picked up by the
      # per-request re-scan with no restart. The dir (not the single legacy file) is
      # mounted so new files appear; host dir must be writable by uid 1000 (see
      # secrets/README.md chown step).
      - ./secrets/google_tokens:/token
      # The shared Desktop-app OAuth client (issue #53): add_account reads client_id /
      # client_secret from it to build the consent URL and exchange the code. Read-only;
      # named so it never collides with the google_token*.json scan.
      - ./secrets/google_oauth_client.json:/token/google_oauth_client.json:ro
    tmpfs:
      # /tmp: git temp files (memory versioner), alembic scratch, claude CLI ephemeral
      # state, and Python/Node runtime scratch — all write to /tmp on a read-only rootfs.
      - /tmp:uid=1000,gid=1000
    healthcheck:
      # init_db creates the sqlite file on boot, so its presence means the app got past startup.
      test: ["CMD", "test", "-f", "/data/chief.db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # chief's own Google Calendar MCP server (docker/mcp-calendar). FastMCP, streamable-HTTP
  # at http://mcp-calendar:8003/mcp on the internal network (no host ports). Replaces the
  # nspady mcp-gcal: FastMCP gives each connection its own transport, so the per-task MCP
  # connections chief opens don't collide ("Server already initialized").
  #
  # Multi-account token directory (issue #56, security-narrowed by issue #57):
  #   TOKEN_DIR=/token is re-scanned per request for all google_token*.json files
  #   (issue #50); each file becomes one registered account.  A token dropped after
  #   boot is picked up on the next request — no restart needed.  Add accounts by
  #   placing additional token files:
  #     ./secrets/google_tokens/google_token.json          → primary (default) account
  #     ./secrets/google_tokens/google_token_work.json     → account labeled "work@corp.com"
  #   Only the dedicated ./secrets/google_tokens/ subdirectory is mounted at /token so
  #   unrelated secrets (claude_code_oauth_token, discord_bot_token,
  #   google_oauth_client.json, telegram_bot_token) are never visible inside this
  #   container (issue #57).  The whole ./secrets dir is intentionally NOT mounted here.
  mcp-calendar:
    profiles: ["google"]
    build:
      context: ./docker/mcp-calendar
    restart: unless-stopped
    # Refreshes the access token in memory only — never writes the shared token file, so
    # a read-only mount is correct (the sheets container is the sole writer).
    user: "${MCP_GOOGLE_UID:-1000}:${MCP_GOOGLE_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    networks:
      - mcp-internal
    environment:
      GOOGLE_TOKEN_PATH: /token/google_token.json
      # Mount the secrets dir as /token so all google_token*.json files are accessible.
      TOKEN_DIR: /token
      # Unset → falls through to owner_tz in the mounted config.yaml (the source of truth);
      # set it here or in .env only to override per-deploy.
      OWNER_TZ: ${OWNER_TZ:-}
    volumes:
      # Dedicated tokens subdir mounted read-only (issue #57): only google_token*.json
      # files live in ./secrets/google_tokens/, so unrelated secrets are never exposed
      # inside this container.  Place token files there, not directly under ./secrets/.
      - ./secrets/google_tokens:/token:ro
      - ./config.yaml:/config/config.yaml:ro
    tmpfs:
      # Python runtime scratch (httplib2 socket temp, googleapiclient, FastMCP internals).
      - /tmp:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # chief's Google Drive MCP server (docker/mcp-drive, ported from genesis-x). FastMCP,
  # streamable-HTTP at http://mcp-drive:8001/mcp. Read a Doc/PDF/Office file; render +
  # upload a Markdown file as PDF (approval-gated).
  #
  # Multi-account token directory (issue #47):
  #   TOKEN_DIR=/token is scanned at startup for all google_token*.json files; each file
  #   becomes one registered account.  Add accounts by placing additional token files:
  #     ./secrets/google_tokens/google_token.json          → primary (default) account
  #     ./secrets/google_tokens/google_token_work.json     → account labeled "work@corp.com"
  #   Only the dedicated ./secrets/google_tokens/ subdirectory is mounted at /token so
  #   unrelated secrets are never visible inside this container (issue #57).
  mcp-drive:
    profiles: ["google"]
    build:
      context: ./docker/mcp-drive
    restart: unless-stopped
    # Read-only token: refreshes in memory only (sheets is the sole token writer).
    user: "${MCP_GOOGLE_UID:-1000}:${MCP_GOOGLE_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    networks:
      - mcp-internal
    environment:
      GOOGLE_TOKEN_PATH: /token/google_token.json
      # Scan the whole directory so all google_token*.json files are accessible
      # for multi-account support (issue #47).
      TOKEN_DIR: /token
    volumes:
      # Dedicated tokens subdir mounted read-only (issue #57/#47): only google_token*.json
      # files live in ./secrets/google_tokens/, so unrelated secrets are never exposed.
      # Directory mount enables multi-account — all google_token*.json files are visible.
      - ./secrets/google_tokens:/token:ro
    tmpfs:
      # ReadDriveFile uses tempfile.mkstemp() to stage downloaded Office/PDF files before
      # passing them to MarkItDown; WeasyPrint also writes temp files during PDF rendering.
      - /tmp:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # chief's Google Sheets MCP server (docker/mcp-sheets). First-party FastMCP server
  # (issue #47 replaces xing5/mcp-google-sheets wrapper) — multi-account per-request
  # credential selection + atomic per-account token write-back.  Row-1 guard preserved.
  # FastMCP, streamable-HTTP at http://mcp-sheets:8002/mcp.
  # The sole writer of ALL google_token*.json files in TOKEN_DIR (per-account atomic
  # write-back via temp-then-rename; concurrent writes to different account files are safe).
  #
  # Multi-account token directory (issue #47, per-request re-scan issue #60):
  #   TOKEN_DIR=/token is re-scanned per request for all google_token*.json files,
  #   so a token dropped after boot is picked up immediately — no restart needed.
  #   The whole directory is mounted WRITABLE so the server can write back
  #   refreshed tokens to each account's own file atomically.
  mcp-sheets:
    profiles: ["google"]
    build:
      context: ./docker/mcp-sheets
    restart: unless-stopped
    user: "${MCP_GOOGLE_UID:-1000}:${MCP_GOOGLE_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    networks:
      - mcp-internal
    environment:
      # Token path for the primary (legacy) account; TOKEN_DIR covers all accounts.
      TOKEN_PATH: /token/google_token.json
      # Scan the whole directory for multi-account support (issue #47).
      TOKEN_DIR: /token
    volumes:
      # Writable directory mount — sheets is the sole writer of all google_token*.json
      # files (one per account).  Each write is atomic (temp-then-rename) so concurrent
      # writes to different account files never collide.  Mint tokens first via
      # python -m chief.tools.google.auth before starting; if a file is absent Docker
      # creates a *directory* at that path and the server fails to load the token.
      # Sourced from the dedicated google_tokens/ subdir (issue #58): same physical
      # directory that mcp-calendar scans, so rotation stays consistent.
      - ./secrets/google_tokens:/token
    tmpfs:
      # Python runtime scratch; atomic write uses tempfile.mkstemp() in /token dir,
      # but the rename target is in /token (the volume), so temp files land there too.
      # /tmp is kept for other runtime scratch.
      - /tmp:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # chief's OWN Google Gmail MCP server (docker/mcp-gmail-chief, issue #48; cutover #52).
  # FastMCP, streamable-HTTP at http://mcp-gmail:8004/mcp. The third-party
  # mcp-google-gmail dependency was dropped here — this service now runs chief's own
  # multi-account server (the chief-owned image keeps the SDK tool names, so the gate /
  # tier wiring is unchanged). The transparent "sent by an assistant" signature is
  # appended server-side to every outbound message (send/reply/draft).
  #
  # Multi-account token directory (issue #48, per-request re-scan issue #60):
  #   TOKEN_DIR=/token is re-scanned per request for all google_token*.json files;
  #   each file becomes one registered account, selected via the X-Account-Label header
  #   (same pattern as mcp-calendar). A token dropped after boot is picked up on the
  #   next request — no restart needed.
  #
  # Token directory mount (mirrors #57/#58 for calendar): only ./secrets/google_tokens/
  # is mounted at /token — never the whole ./secrets dir. The mount is READ-ONLY
  # (mcp-sheets is the sole writer of the shared token files); the server refreshes the
  # access token in memory only and never writes the shared file.
  mcp-gmail:
    profiles: ["google"]
    build:
      context: ./docker/mcp-gmail-chief
    restart: unless-stopped
    user: "${MCP_GOOGLE_UID:-1000}:${MCP_GOOGLE_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    networks:
      - mcp-internal
    environment:
      PORT: 8004
      GOOGLE_TOKEN_PATH: /token/google_token.json
      TOKEN_DIR: /token
      # Transparent signature appended to every outbound message. Empty → server uses its
      # own multi-line default. {owner} is filled from OWNER_NAME (else "the owner").
      GMAIL_SIGNATURE: ${GMAIL_SIGNATURE:-}
      OWNER_NAME: ${OWNER_NAME:-}
    volumes:
      # Dedicated tokens subdir mounted read-only (mirrors mcp-calendar, issue #57).
      # Only google_token*.json files live here — unrelated secrets never exposed.
      - ./secrets/google_tokens:/token:ro
    tmpfs:
      # Python runtime scratch (httplib2 socket temp, googleapiclient, FastMCP internals).
      - /tmp:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Playwright browser automation (docker/mcp-playwright). Stock @playwright/mcp 0.0.76,
  # headless Chromium with --no-sandbox, streamable HTTP at
  # http://mcp-playwright:3000/mcp on the internal compose network (no host ports).
  # Read tools (navigate, snapshot, screenshot, inspection) are pre-approved; write
  # tools (click, type, JS) are approval-gated. Owner-only — guests never receive the
  # playwright MCP server.
  # Enable with: set playwright_enabled: true in config.yaml, then:
  #   docker compose --profile playwright up
  mcp-playwright:
    profiles: ["playwright"]
    build:
      context: ./docker/mcp-playwright
    restart: unless-stopped
    # --no-sandbox is required in the CMD because this hardened profile (non-root user,
    # cap_drop ALL + SYS_ADMIN only, no-new-privileges:true) blocks the setuid
    # chrome-sandbox helper Chromium uses for its own process sandbox. SYS_ADMIN is
    # kept for the kernel namespace operations Chromium still performs in headless mode.
    user: "1000:1000"
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    security_opt:
      - no-new-privileges:true
    # playwright-net only — no route to mcp-internal, so a hostile or compromised
    # page cannot SSRF into the Google MCP services (calendar/drive/sheets/gmail).
    # Internet egress is preserved (playwright-net has no internal_only restriction).
    networks:
      - playwright-net
    tmpfs:
      # Chromium writes profile data, crash dumps, and devtools sockets to /tmp.
      - /tmp
    volumes:
      # Shared output directory: screenshot files written by playwright server land here;
      # core reads them (read-only mount below) to deliver via send_file. The
      # --output-dir /screenshots flag in the CMD keeps the path deterministic.
      - screenshots:/screenshots
      # Persistent browser profile (issue #35): Chromium writes its full profile
      # (cookies, localStorage, IndexedDB, session state) here via --user-data-dir.
      # Because this is a named volume, all state survives container restarts —
      # cookie-based logins persist by construction, no explicit save step needed.
      # Writable — Chromium is the sole writer; core never mounts this volume.
      - browser-profile:/browser-profile
    # Liveness probe: @playwright/mcp serves its streamable-HTTP handler at /mcp
    # (a GET to / 404s), and a bare GET to /mcp answers with a non-2xx status, so
    # this checks only that the server is up and routing — no curl --fail/-f, which
    # would flag a healthy server unhealthy on every check (issue #38).
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "5", "http://127.0.0.1:3000/mcp"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  discord_bot_token:
    file: ./secrets/discord_bot_token
  claude_code_oauth_token:
    file: ./secrets/claude_code_oauth_token
  google_oauth_client.json:
    file: ./secrets/google_oauth_client.json

volumes:
  sqlite-data:
  memory:
  claude-home:
  workspace:  # M7 scratch for core's Read/Write/Edit tools
  screenshots:  # M13 screenshot delivery: mcp-playwright writes, core reads (ro)
  browser-profile:  # issue #35: Chromium --user-data-dir; cookies/session survive restarts

# Two named networks provide SSRF isolation (issue #33).
#
# mcp-internal  — shared by core + the four Google MCP sidecars (calendar, drive,
#                 sheets, gmail).  Invisible to mcp-playwright (hostile page cannot
#                 SSRF into Google services).
# playwright-net — shared by core + mcp-playwright. Has full internet egress (no
#                 internal_only flag). Google MCP services are never attached here.
#
# core sits on both so it can dispatch tasks to either group.
networks:
  mcp-internal:
  playwright-net:
