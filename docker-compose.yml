# chief core stack (M0/M1) + chief's own Google MCP servers (M5/M8) + the shell/code
# sandbox (M7). Outbound-only — Telegram long-poll / Discord gateway, no public ingress.
# Secrets are Docker secrets (files under ./secrets/, mounted at /run/secrets, read by
# config.py).
#
# Sandbox (M7, opt-in):  a secret-free, locked-down worker behind the "sandbox" profile
#         that runs the owner's gated bash commands. Core reaches it over a stdlib socket
#         at sandbox:8765 (never host-published). Flip shell_enabled/workspace_enabled in
#         config.yaml, then:  docker compose --profile sandbox up
#
# Setup:  put ./secrets/claude_code_oauth_token, then configure either or both chat
#         platforms (config rejects boot with neither):
#           Telegram — ./secrets/telegram_bot_token + OWNER_TELEGRAM_ID
#           Discord  — ./secrets/discord_bot_token  + OWNER_DISCORD_ID (enable the
#                      privileged message_content intent in the Developer Portal)
#         A referenced docker-secret file must exist, so for the platform you skip,
#         `touch` its empty token file (e.g. `touch secrets/discord_bot_token`). Then:
#           docker compose up core
#
# Google (M5/M8, opt-in):  chief's own FastMCP servers — calendar (:8003), drive (:8001),
#         sheets (:8002), gmail (:8004) — each a separate container on the internal compose
#         network, reached by core over streamable-HTTP at http://mcp-<svc>:<port>/mcp
#         (never host-published). Mint the shared token (python -m chief.tools.google.auth),
#         flip the matching *_enabled in config.yaml, then:
#           docker compose --profile google up
#         The four sit behind the "google" profile, so a plain `up` skips them.
services:
  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    restart: unless-stopped
    environment:
      # Non-secret: overrides config.yaml. Must NOT set ANTHROPIC_API_KEY (config rejects it).
      # Both owner ids are optional here — config requires at least one platform fully set
      # (id + token). Leave one blank to run the other platform only.
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-}
      OWNER_DISCORD_ID: ${OWNER_DISCORD_ID:-}
    secrets:
      - telegram_bot_token
      - discord_bot_token
      - claude_code_oauth_token
    volumes:
      # Mounted read-only over the image's baked copy (Dockerfile COPYs it as a fallback)
      # so a config.yaml edit takes effect on `up -d` with no rebuild. config.py reads
      # ./config.yaml relative to WORKDIR /app, so this is the exact path it loads.
      - ./config.yaml:/app/config.yaml:ro
      - sqlite-data:/data
      - memory:/memory
      # Shared scratch (M7): chief's built-in Read/Write/Edit (core) and the sandbox
      # shell operate on the same files. Harmless when the shell/workspace are disabled.
      - workspace:/workspace
      # The claude CLI writes each session's transcript under /root/.claude (container
      # runs as root). Without this volume a `compose up`/recreate wipes every stored
      # session, leaving sqlite's sdk_session_ids pointing at sessions that no longer
      # exist → the CLI exits 1 on resume. Persist it so recreates keep conversations.
      - claude-home:/root/.claude
    healthcheck:
      # init_db creates the sqlite file on boot, so its presence means the app got past startup.
      test: ["CMD", "test", "-f", "/data/chief.db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # chief's own Google Calendar MCP server (docker/mcp-calendar). FastMCP, streamable-HTTP
  # at http://mcp-calendar:8003/mcp on the internal network (no host ports). Replaces the
  # nspady mcp-gcal: FastMCP gives each connection its own transport, so the per-task MCP
  # connections chief opens don't collide ("Server already initialized").
  mcp-calendar:
    profiles: ["google"]
    build:
      context: ./docker/mcp-calendar
    restart: unless-stopped
    # Refreshes the access token in memory only — never writes the shared token file, so
    # a read-only mount is correct (the sheets container is the sole writer).
    user: "${MCP_GOOGLE_UID:-1000}:${MCP_GOOGLE_GID:-1000}"
    environment:
      GOOGLE_TOKEN_PATH: /token/google_token.json
      # Unset → falls through to owner_tz in the mounted config.yaml (the source of truth);
      # set it here or in .env only to override per-deploy.
      OWNER_TZ: ${OWNER_TZ:-}
    volumes:
      - ./secrets/google_token.json:/token/google_token.json:ro
      - ./config.yaml:/config/config.yaml:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # chief's Google Drive MCP server (docker/mcp-drive, ported from genesis-x). FastMCP,
  # streamable-HTTP at http://mcp-drive:8001/mcp. Read a Doc/PDF/Office file; render +
  # upload a Markdown file as PDF (approval-gated).
  mcp-drive:
    profiles: ["google"]
    build:
      context: ./docker/mcp-drive
    restart: unless-stopped
    # Read-only token: refreshes in memory only (sheets is the sole token writer).
    user: "${MCP_GOOGLE_UID:-1000}:${MCP_GOOGLE_GID:-1000}"
    environment:
      GOOGLE_TOKEN_PATH: /token/google_token.json
    volumes:
      - ./secrets/google_token.json:/token/google_token.json:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # chief's Google Sheets MCP server (docker/mcp-sheets). Wraps third-party
  # mcp-google-sheets with a row-1 (header) write guard. FastMCP, streamable-HTTP at
  # http://mcp-sheets:8002/mcp. The sole writer of the shared token file (writable mount).
  mcp-sheets:
    profiles: ["google"]
    build:
      context: ./docker/mcp-sheets
    restart: unless-stopped
    user: "${MCP_GOOGLE_UID:-1000}:${MCP_GOOGLE_GID:-1000}"
    environment:
      # The package's own auth: OAuth client + the shared minted token.
      CREDENTIALS_PATH: /run/secrets/google_oauth_client.json
      TOKEN_PATH: /token/google_token.json
    secrets:
      - google_oauth_client.json
    volumes:
      # Writable — mcp-google-sheets persists a refreshed token here. Mint it first
      # (python -m chief.tools.google.auth); if the file is absent Docker creates a
      # *directory* at this path and the server fails to load the token.
      - ./secrets/google_token.json:/token/google_token.json
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # chief's Google Gmail MCP server (docker/mcp-gmail). Wraps third-party
  # mcp-google-gmail with a transparent "sent by an assistant" signature appended to
  # every outbound message. FastMCP, streamable-HTTP at http://mcp-gmail:8004/mcp.
  # The shared token is mounted READ-ONLY (sheets is the sole writer): mcp-google-gmail
  # rewrites the token on refresh, so server.py seeds a writable per-container copy at
  # /tmp from the :ro seed mount and points GMAIL_TOKEN_PATH there — one writer upheld.
  mcp-gmail:
    profiles: ["google"]
    build:
      context: ./docker/mcp-gmail
    restart: unless-stopped
    user: "${MCP_GOOGLE_UID:-1000}:${MCP_GOOGLE_GID:-1000}"
    environment:
      PORT: 8004
      # The package's own auth: OAuth client + the seeded (writable) token copy.
      GMAIL_CREDENTIALS_PATH: /run/secrets/google_oauth_client.json
      GMAIL_SEED_TOKEN_PATH: /seed/google_token.json
      GMAIL_TOKEN_PATH: /tmp/gmail_token.json
      # Transparent signature appended to every outbound message. Empty → server uses its
      # own multi-line default. {owner} is filled from OWNER_NAME (else "the owner").
      GMAIL_SIGNATURE: ${GMAIL_SIGNATURE:-}
      OWNER_NAME: ${OWNER_NAME:-}
    secrets:
      - google_oauth_client.json
    volumes:
      # Read-only: the gmail package refreshes the token in a writable /tmp copy (seeded
      # from here at startup), never this shared file — sheets stays the sole writer.
      - ./secrets/google_token.json:/seed/google_token.json:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # chief's shell/code sandbox (docker/sandbox, M7). A locked-down worker behind the
  # "sandbox" profile (a plain `up` skips it). Core forwards each gated bash command here
  # over a stdlib socket on :8765 (no host ports). NO secrets, restricted FS (read-only
  # rootfs + the shared workspace volume + tmpfs scratch), non-root, resource-limited.
  # Enable with: flip shell_enabled/workspace_enabled in config.yaml, then
  #   docker compose --profile sandbox up
  sandbox:
    profiles: ["sandbox"]
    build:
      # Repo root so the Dockerfile can copy the stdlib server out of the chief package.
      context: .
      dockerfile: docker/sandbox/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    # Deliberately NO `secrets:` block — the sandbox must never hold the Max token.
    read_only: true
    tmpfs:
      - /tmp
      - /home/sandbox
    security_opt:
      - no-new-privileges:true
    # Blast-radius caps for a process running arbitrary owner commands.
    mem_limit: 1g
    pids_limit: 256
    cpus: 1.0
    environment:
      SANDBOX_PORT: 8765
      # Mirror config.yaml's shell limits so the sandbox enforces the same bounds.
      SHELL_TIMEOUT_SECONDS: ${SHELL_TIMEOUT_SECONDS:-120}
      SHELL_OUTPUT_LIMIT: ${SHELL_OUTPUT_LIMIT:-64000}
    volumes:
      # The ONLY writable persistent mount — shared rw with core.
      - workspace:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  discord_bot_token:
    file: ./secrets/discord_bot_token
  claude_code_oauth_token:
    file: ./secrets/claude_code_oauth_token
  google_oauth_client.json:
    file: ./secrets/google_oauth_client.json

volumes:
  sqlite-data:
  memory:
  claude-home:
  workspace:  # M7 scratch, shared rw between core (Read/Write/Edit) and the sandbox shell
