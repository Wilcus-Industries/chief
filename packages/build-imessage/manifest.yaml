name: build-imessage
description: Set up the macOS iMessage channel (self-DM, owner-only by default), plus the imsg CLI for outbound sends and on-demand reads.
dependencies:
  - screening
mcp_servers: {}
skills:
  - skills/build-imessage
  - skills/imsg
config_keys:
  - imessage.enabled
  - imessage.owner_handles
  - imessage.poll_seconds
secrets: []
