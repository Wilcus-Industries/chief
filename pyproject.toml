[project]
name = "chief"
version = "0.4.0"
description = "Self-editing agent harness with package-based capabilities."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "William Chastain" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    # The [asyncio] extra force-depends on greenlet (no platform marker);
    # SQLAlchemy's own greenlet dep is conditional and skips some interpreters
    # (e.g. CPython 3.14), which left the async engine unbootable there.
    "sqlalchemy[asyncio]>=2",
    "aiosqlite>=0.20",
    "pyyaml>=6",
    "croniter>=3",
    "starlette>=0.47",
    "uvicorn>=0.30",
    # Starlette requires it for any form parsing (the login POST).
    "python-multipart>=0.0.18",
    # The MCP client seam (HTTP + stdio) speaks through the official SDK.
    "mcp>=1",
]

[project.urls]
Homepage = "https://github.com/Wilcus-Industries/chief"
Issues = "https://github.com/Wilcus-Industries/chief/issues"
Packages = "https://github.com/Wilcus-Industries/chief-packages"

[project.scripts]
chief-cli = "chief.cli:main"
chief-pkg = "chief.pkg.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4",
    # The browser e2e capstone (#268) drives the shipped JS in real Chromium;
    # opt-in (the `browser` marker), so the default suite never launches it.
    "playwright>=1.40",
    # The obsidian-memory package's code ships as an editable subpackage so its
    # judge is importable in-process, its `chief-memory` CLI runs, and its real
    # model2vec + chromadb path is exercised by the test suite (#207).
    "chief-obsidian-memory",
]

[tool.uv.sources]
chief-obsidian-memory = { path = "packages/obsidian-memory", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chief"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["chief"]
strict = true
# Exclude runtime state dirs — data/ contains installed package hooks that
# collide with same-named source files (e.g. duplicate "hooks" module).
exclude = ["^data/", "^packages/"]

# pyyaml ships no inline stubs for the bare `import yaml` module name;
# croniter ships no py.typed at all.
[[tool.mypy.overrides]]
module = ["yaml", "croniter.*", "croniter"]
ignore_missing_imports = true

# The obsidian-memory heavy deps ship no usable type stubs.
[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "model2vec.*",
    "obsidiantools.*",
    "networkx.*",
    # obsidian-memory package ships no py.typed; its tests import it directly
    "chief_obsidian_memory.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Guardrail: every real test is sub-second; a hung test fails fast.
timeout = 30
# The browser e2e (#268) is opt-in: excluded by default, run with `-m browser`
# in its own CI job (a real Chromium launch is slow and needs a browser binary).
addopts = "-m 'not browser'"
markers = [
    "browser: end-to-end test that drives a real browser (opt-in; needs playwright + `playwright install chromium`)",
]
