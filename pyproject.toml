[project]
name = "chief"
version = "0.0.0"
description = "Personal AI assistant on Claude Max — S0 walking skeleton (throwaway)."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2",
    "python-telegram-bot>=21",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# S0 ships scripts under s0/, not an installable package — install deps only.
package = false

[tool.ruff]
target-version = "py312"
src = ["s0"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
