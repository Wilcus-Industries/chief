[project]
name = "chief"
version = "0.0.0"
description = "Personal AI assistant on Claude Max — foundations (M0/M1)."
requires-python = ">=3.12"
dependencies = [
    "github-copilot-sdk>=1",
    "python-telegram-bot>=21",
    "sqlalchemy>=2",
    "aiosqlite>=0.20",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "discord-py>=2",
    "croniter>=3",
    "httpx>=0.28",
    "alembic>=1.18.4",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    # Host-only OAuth helper (chief.tools.google.auth). Not a runtime dep — the core
    # container reaches Google through the MCP servers, not this script.
    "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chief"]
# Include the Alembic config and migration scripts so they are bundled inside
# the wheel (and thus present in the Docker image after `uv sync`). Without
# this, migrate-on-start fails in the container because the files are absent.
include = [
    "src/chief/alembic.ini",
    "src/chief/alembic/**",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
# docker/mcp-*/server.py are standalone vendored MCP server images with their own
# requirements (googleapiclient, weasyprint, mcp-google-sheets) — not part of the chief
# package and not installed in this venv, so they are linted/typed inside their images.
# vendor/ holds the anthropics/skills submodule (M10) — upstream code we package as-is,
# not ours to lint or type.
extend-exclude = ["docker", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["chief"]
strict = true
# Skip the vendored MCP server images and the anthropics/skills submodule (see the ruff
# note above) when invoked as `mypy .` — upstream code, not part of the chief package.
exclude = ['^docker/', '^vendor/']

# google-auth-oauthlib ships no py.typed; the Google OAuth helper imports it lazily.
[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true

# croniter ships no py.typed; used by chief.core.schedule_time for cron next-fire.
[[tool.mypy.overrides]]
module = ["croniter.*"]
ignore_missing_imports = true

# The ``mcp`` stack (mcp + its starlette transitive) came in via the agent SDK removed
# in #88 and is no longer installed in the chief venv — only the opt-in live tests and
# the docker MCP-server tests use it (they importorskip it and drive the vendored
# docker/mcp-* servers, whose deps live in their images). Ignore the missing modules so
# those guarded imports type-check without the package present.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "starlette", "starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Guardrail: every real test is sub-second; a hung test fails fast instead of
# blocking the ~10 min approval fail-closed timeout.
timeout = 30
