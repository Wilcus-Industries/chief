[project]
name = "chief"
version = "0.2.0"
description = "Self-editing agent harness with package-based capabilities."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    # The [asyncio] extra force-depends on greenlet (no platform marker);
    # SQLAlchemy's own greenlet dep is conditional and skips some interpreters
    # (e.g. CPython 3.14), which left the async engine unbootable there.
    "sqlalchemy[asyncio]>=2",
    "aiosqlite>=0.20",
    "pyyaml>=6",
    "croniter>=3",
    "starlette>=0.47",
    "uvicorn>=0.30",
    # Starlette requires it for any form parsing (the login POST).
    "python-multipart>=0.0.18",
    # The MCP client seam (HTTP + stdio) speaks through the official SDK.
    "mcp>=1",
]

[project.scripts]
chief-cli = "chief.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chief"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["chief"]
strict = true

# pyyaml ships no inline stubs for the bare `import yaml` module name;
# croniter ships no py.typed at all.
[[tool.mypy.overrides]]
module = ["yaml", "croniter.*", "croniter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Guardrail: every real test is sub-second; a hung test fails fast.
timeout = 30
